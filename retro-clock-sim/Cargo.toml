[package]
name = "retro_clock_sim"
version = "0.1.0"
edition = "2021"

[dependencies]
ansi-escapes = "0.2.0"
anyhow = "1.0.97"
axum = { version = "0.8.4", features = ["macros"] }
axum-extra = { version = "0.10.1", features = ["cookie"] }
chrono = "0.4.41"
chrono-tz = "0.10.4"
cookie = "0.18.1"
crossterm = "0.29.0"
env_logger = "0.11.8"
getch-rs = "0.2.0"
headers = "0.4.1"
log = "0.4.27"
ratatui = "0.29.0"
reqwest = { version = "0.12.15", features = ["blocking"] }
retro_clock_core = { path = "../retro-clock-core", features = ["login"]}
serde = "1.0.225"
serde_json = "1.0.140"
time = "0.3.43"
tokio = "1.47.1"
tower-http = { version = "0.6.6", features = ["cors"] }

[features]
default = ["simulate_delay"]
no_cors = []
simulate_delay = []
